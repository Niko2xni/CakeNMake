<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Victorian Cake Decoration Preview</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #c0bcb4;
        }

        canvas {
            display: block;
        }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128/examples/js/controls/OrbitControls.js"></script>
</head>

<body>
    <script>
        // ============================================================
        // SCENE / CAMERA / RENDERER
        // ============================================================
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0xbfbbb3);

        const camera = new THREE.PerspectiveCamera(40, window.innerWidth / window.innerHeight, 0.1, 100);
        camera.position.set(0, 0.5, 18);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        renderer.toneMapping = THREE.ACESFilmicToneMapping;
        renderer.toneMappingExposure = 1.05;
        document.body.appendChild(renderer.domElement);

        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.08;
        controls.target.set(0, 0, 0);
        controls.minDistance = 5;
        controls.maxDistance = 30;
        controls.update();

        // ============================================================
        // LIGHTS
        // ============================================================
        scene.add(new THREE.AmbientLight(0xffffff, 0.45));

        const dirLight = new THREE.DirectionalLight(0xffffff, 1.4);
        dirLight.position.set(4, 14, 12);
        scene.add(dirLight);

        const fillLight = new THREE.DirectionalLight(0xf0f0ff, 0.35);
        fillLight.position.set(-8, -5, 6);
        scene.add(fillLight);

        const sideLight = new THREE.DirectionalLight(0xffffff, 0.5);
        sideLight.position.set(10, 5, 8);
        scene.add(sideLight);

        // ============================================================
        // MATERIALS
        // ============================================================
        const CREAM     = 0xf2ead8;
        const CREAM_DIM = 0xddd5c2;  // noticeably darker for scallop contrast
        const PEARL_C   = 0xc8c8c8;

        const creamMat   = new THREE.MeshStandardMaterial({ color: CREAM,     roughness: 0.60 });
        const creamDbl   = new THREE.MeshStandardMaterial({ color: CREAM,     roughness: 0.60, side: THREE.DoubleSide });
        const scallopMat = new THREE.MeshStandardMaterial({ color: CREAM_DIM, roughness: 0.80 });
        const pearlMat   = new THREE.MeshStandardMaterial({ color: PEARL_C,   roughness: 0.22, metalness: 0.20 });

        // ============================================================
        // MASTER GROUP
        // ============================================================
        const G = new THREE.Group();
        scene.add(G);

        // ============================================================
        // BACKGROUND PANEL (cake side wall)
        // ============================================================
        {
            const bg = new THREE.Mesh(
                new THREE.PlaneGeometry(14, 11),
                new THREE.MeshStandardMaterial({ color: 0xe8e2d8, roughness: 0.95 }) // slightly beige to contrast cream decorations
            );
            bg.position.z = -0.4;
            G.add(bg);
        }

        // ============================================================
        // LAYOUT
        // ============================================================
        const PANEL_COUNT = 5;
        const TOTAL_W     = 11;
        const PANEL_W     = TOTAL_W / PANEL_COUNT;   // 2.2 units per panel
        const ATTACH_Y    = 2.2;   // Y level of the rope / pearls
        const SWAG_DROP   = 1.6;   // Catenary drop at centre (less so panels look wide not tall)
        const CURTAIN_H   = 2.4;   // Total curtain height top to bottom
        const SCALLOP_TOP = 0.5;   // Y of scallop zone top row centre
        const SCALLOP_BOT = -4.2;  // Y of bottom of scallop zone
        const ROPE_SAG    = 0.15;  // gentle sag of the rope itself

        // Attachment X positions (one per panel boundary, 6 for 5 panels)
        const attachXs = [];
        for (let i = 0; i <= PANEL_COUNT; i++) {
            attachXs.push(-TOTAL_W / 2 + i * PANEL_W);
        }

        // ============================================================
        // ROPE
        // ============================================================
        {
            const pts = [];
            const steps = 120;
            for (let s = 0; s <= steps; s++) {
                const t = s / steps;
                const x = -TOTAL_W / 2 + t * TOTAL_W;
                const y = ATTACH_Y - ROPE_SAG * Math.sin(t * Math.PI);
                pts.push(new THREE.Vector3(x, y, 0.10));
            }
            const curve = new THREE.CatmullRomCurve3(pts);
            G.add(new THREE.Mesh(
                new THREE.TubeGeometry(curve, 120, 0.04, 8, false),
                creamMat
            ));
        }

        // ============================================================
        // PEARL BEADS at attachment points
        // ============================================================
        const pearlGeo = new THREE.SphereGeometry(0.20, 22, 16);
        for (const ax of attachXs) {
            const t   = (ax + TOTAL_W / 2) / TOTAL_W;
            const py  = ATTACH_Y - ROPE_SAG * Math.sin(t * Math.PI);
            const p   = new THREE.Mesh(pearlGeo, pearlMat);
            p.position.set(ax, py, 0.14);
            G.add(p);
        }

        // ============================================================
        // CURTAIN SWAG PANELS
        // ============================================================
        // Each panel is a sagging "U"-shaped fabric swag. We build it
        // by deforming a PlaneGeometry. The geometry spans [−PW/2 .. +PW/2]
        // in X (normalised to nx = −1..1) and [0..1] in V (top to bottom).
        // The sag is applied in Y: bottom edge dips the most at the centre.
        // The bow pushes the centre forward in Z.

        function buildSwagPanel(panelWidth, totalDrop, panelHeight) {
            // segX = along width, segY = along height
            const segX = 60, segY = 50;
            const geo  = new THREE.PlaneGeometry(panelWidth, 1.0, segX, segY);
            // PlaneGeometry: X in [-pw/2 .. pw/2], Y in [-0.5 .. 0.5]
            const pos  = geo.attributes.position;

            const hW = panelWidth / 2;

            for (let i = 0; i < pos.count; i++) {
                const x  = pos.getX(i);
                const yN = pos.getY(i);          // -0.5 at bottom, +0.5 at top

                const nx = x / hW;               // −1..1 across width
                const tv = (0.5 - yN);           // 0.0 at top, 1.0 at bottom

                // Catenary U-sag: peaks at centre (nx=0), zero at edges (nx=±1)
                // Uses (1 − nx²) — a parabola, max=1 at centre, 0 at edges.
                // tv scales it so the top row barely moves, bottom row sags fully.
                const sagShape = 1 - nx * nx;    // U-shape: max at centre
                const sag      = totalDrop * sagShape * tv;

                // Forward bow: fabric bows out toward viewer at centre + midway down
                const bowCenter = 1 - nx * nx;   // same U shape
                const bow       = 0.32 * bowCenter * Math.sin(tv * Math.PI);

                // Gather tucks near the top edge at each side
                const gatherZone = Math.max(0, (Math.abs(nx) - 0.72) / 0.28);
                const gatherFold = gatherZone * gatherZone * Math.sin(gatherZone * Math.PI * 3) * 0.07;

                pos.setXYZ(i, x, yN * panelHeight - sag, bow + gatherFold);
            }

            geo.computeVertexNormals();
            return geo;
        }

        for (let p = 0; p < PANEL_COUNT; p++) {
            const cx   = -TOTAL_W / 2 + (p + 0.5) * PANEL_W;
            // Build a panel slightly wider than slot so adjacent panels overlap at top
            const geo  = buildSwagPanel(PANEL_W + 0.30, SWAG_DROP, CURTAIN_H);
            const mesh = new THREE.Mesh(geo, creamDbl);
            // The plane's Y-centre maps to ATTACH_Y - CURTAIN_H/2
            mesh.position.set(cx, ATTACH_Y - CURTAIN_H / 2, 0.04);
            G.add(mesh);
        }

        // Small gather-fold rosette rings at each attachment point
        for (const ax of attachXs) {
            const t  = (ax + TOTAL_W / 2) / TOTAL_W;
            const py = ATTACH_Y - ROPE_SAG * Math.sin(t * Math.PI) - 0.08;
            for (let f = 0; f < 4; f++) {
                const angle  = (f / 4) * Math.PI;
                const loopGeo = new THREE.TorusGeometry(0.11, 0.03, 6, 14, Math.PI);
                const loop    = new THREE.Mesh(loopGeo, creamMat);
                loop.rotation.x = Math.PI / 2;
                loop.rotation.z = angle - Math.PI / 4;
                loop.position.set(ax, py - f * 0.07, 0.16 + f * 0.01);
                G.add(loop);
            }
        }

        // ============================================================
        // SWIRL ROSETTES above each pearl attachment
        // ============================================================
        function buildPetalGeo(length, width, curl, thick) {
            const geo = new THREE.SphereGeometry(1, 10, 7);
            const pos = geo.attributes.position;
            for (let i = 0; i < pos.count; i++) {
                let x = pos.getX(i), y = pos.getY(i), z = pos.getZ(i);
                const t = (y + 1) * 0.5;
                const tp = Math.min(1.8, t / 1.0);
                x = x * tp * width;
                z = z * tp * thick;
                y = y * length;
                x += curl * t * t * length * 0.08;
                pos.setXYZ(i, x, y, z);
            }
            pos.needsUpdate = true;
            geo.computeVertexNormals();
            return geo;
        }

        function buildRosette(size) {
            const grp     = new THREE.Group();
            const pGeo    = buildPetalGeo(0.14 * size, 0.20 * size, 0.6, 0.08 * size);
            const N       = 9;
            const fAngle  = THREE.MathUtils.degToRad(35);
            const fx      = Math.cos(fAngle) * 0.06 * size;
            const fy      = Math.sin(fAngle) * 0.06 * size;
            for (let i = 0; i < N; i++) {
                const a = THREE.MathUtils.degToRad(38) + (i / N) * Math.PI * 2;
                const pm = new THREE.Mesh(pGeo, creamMat);
                pm.position.set(fx + Math.cos(a) * 0.04 * size, fy + Math.sin(a) * 0.04 * size, 0.04 * size);
                pm.rotation.z = a - Math.PI / 2 + THREE.MathUtils.degToRad(20);
                grp.add(pm);
            }
            // Back leaves
            const lGeo = buildPetalGeo(0.38 * size, 0.35 * size, 0.12, 0.04 * size);
            for (const la of [Math.PI, 0]) {
                const lm = new THREE.Mesh(lGeo, creamMat);
                lm.position.set(fx - Math.cos(la) * 0.03 * size, fy, -0.04 * size);
                lm.rotation.z = la - Math.PI / 2;
                grp.add(lm);
            }
            return grp;
        }

        for (const ax of attachXs) {
            const t  = (ax + TOTAL_W / 2) / TOTAL_W;
            const py = ATTACH_Y - ROPE_SAG * Math.sin(t * Math.PI) + 0.55;
            const r  = buildRosette(1.1);
            r.position.set(ax, py, 0.18);
            G.add(r);
        }

        // ============================================================
        // SCALLOP / FISH-SCALE PATTERN (lower half)
        // ============================================================
        // Each scallop is a flat circle with a subtle dome displacement
        // so it reads as a 3D shell/petal shape.

        function buildScallopDome(radius, domeH) {
            const segments = 24;
            const positions = [], normals = [], indices = [];
            // Build a circular mesh with radial + ring subdivisions
            const rings = 10;
            // Centre vertex
            positions.push(0, 0, domeH); // dome apex at z=domeH
            normals.push(0, 0, 1);

            for (let r = 1; r <= rings; r++) {
                const rFrac = r / rings; // 0..1 from centre to edge
                const rr    = radius * rFrac;
                // Dome: z falls from domeH at centre to 0 at edge — cosine profile
                const zVal  = domeH * Math.cos(rFrac * Math.PI / 2);
                const nzVal = Math.sin(rFrac * Math.PI / 2); // outward normal z

                for (let s = 0; s < segments; s++) {
                    const angle = (s / segments) * Math.PI * 2;
                    const nx = Math.cos(angle) * nzVal;
                    const ny = Math.sin(angle) * nzVal;
                    positions.push(Math.cos(angle) * rr, Math.sin(angle) * rr, zVal);
                    normals.push(nx * 0.5, ny * 0.5, Math.max(0.2, nzVal));
                }
            }

            // Fan triangles from centre
            for (let s = 0; s < segments; s++) {
                const a = 1 + s;
                const b = 1 + (s + 1) % segments;
                indices.push(0, a, b);
            }
            // Ring quads
            for (let r = 0; r < rings - 1; r++) {
                for (let s = 0; s < segments; s++) {
                    const base = 1 + r * segments;
                    const a = base + s;
                    const b = base + (s + 1) % segments;
                    const c = base + segments + s;
                    const d = base + segments + (s + 1) % segments;
                    indices.push(a, b, d, a, d, c);
                }
            }

            const geo = new THREE.BufferGeometry();
            geo.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
            geo.setAttribute('normal',   new THREE.Float32BufferAttribute(normals,   3));
            geo.setIndex(indices);
            return geo;
        }

        const S_R     = 0.84;   // scallop radius
        const S_DOME  = 0.30;   // taller dome = much more visible 3D relief
        const S_HX    = S_R * 1.90; // horizontal stride (tight overlap)
        const S_HY    = S_R * 1.30; // vertical stride   (overlap)
        const S_ROWS  = 3;
        const sGeo    = buildScallopDome(S_R, S_DOME); // new 2-arg signature

        for (let row = 0; row < S_ROWS; row++) {
            const offsetX = (row % 2 === 0) ? 0 : S_HX * 0.5;
            const rowY    = SCALLOP_TOP - row * S_HY;
            const rowZ    = -0.28 + row * 0.06; // deeper rows sit further back
            const numC    = Math.ceil(TOTAL_W / S_HX) + 2;
            const startX  = -TOTAL_W / 2 - S_HX + offsetX;

            for (let col = 0; col < numC; col++) {
                const sx = startX + col * S_HX;
                if (sx < -TOTAL_W / 2 - S_R || sx > TOTAL_W / 2 + S_R) continue;

                const sm = new THREE.Mesh(sGeo, scallopMat);
                // New geometry is already built with dome facing +Z, no rotation needed
                sm.position.set(sx, rowY, rowZ);
                G.add(sm);
            }
        }

        // ============================================================
        // SMALL FLEUR-DE-LIS ACCENTS in the diamond gaps
        // ============================================================
        function buildAccent() {
            const grp = new THREE.Group();
            const tipGeo = buildPetalGeo(0.16, 0.065, 0.2, 0.030);

            const c = new THREE.Mesh(tipGeo, creamMat); // centre tip: straight up
            c.position.z = 0.02;
            grp.add(c);

            const leftTip = new THREE.Mesh(tipGeo, creamMat);
            leftTip.rotation.z = THREE.MathUtils.degToRad(42);
            leftTip.position.set(-0.06, -0.02, 0.01);
            grp.add(leftTip);

            const rightTip = new THREE.Mesh(tipGeo, creamMat);
            rightTip.rotation.z = THREE.MathUtils.degToRad(-42);
            rightTip.position.set(0.06, -0.02, 0.01);
            grp.add(rightTip);

            const stamen = new THREE.Mesh(new THREE.SphereGeometry(0.045, 10, 7), creamMat);
            stamen.position.set(0, -0.08, 0.02);
            grp.add(stamen);

            return grp;
        }

        // Accent centres sit in the diamond gap between rows
        for (let row = 0; row < S_ROWS - 1; row++) {
            // Between even and odd rows, the diamond X-centres shift by S_HX/2
            const evenOff  = (row % 2 === 0) ? S_HX * 0.5 : 0;
            const gapY     = SCALLOP_TOP - row * S_HY - S_HY * 0.5;
            const gapZ     = -0.30 + row * 0.07 + 0.05;
            const numG     = Math.ceil(TOTAL_W / S_HX) + 1;
            const startGX  = -TOTAL_W / 2 + evenOff;

            for (let col = 0; col < numG; col++) {
                const gx = startGX + col * S_HX;
                if (gx < -TOTAL_W / 2 + 0.4 || gx > TOTAL_W / 2 - 0.4) continue;
                const acc = buildAccent();
                acc.position.set(gx, gapY, gapZ + 0.10);
                G.add(acc);
            }
        }

        // ============================================================
        // BOTTOM RUFFLE BORDER
        // ============================================================
        function buildRuffleShell(w, h, depth) {
            const sx = 14, sy = 8;
            const geo = new THREE.PlaneGeometry(w, h, sx, sy);
            const pos = geo.attributes.position;
            for (let i = 0; i < pos.count; i++) {
                const x  = pos.getX(i);
                const y  = pos.getY(i);
                const nx = x / (w * 0.5);              // −1..1
                const ny = (y + h * 0.5) / h;           // 0=bottom, 1=top
                // Shell fans forward at the top and collapses at the bottom
                const fan  = ny * Math.cos(nx * Math.PI * 0.5) * depth;
                const tilt = (1 - ny) * depth * 0.25;  // lean back slightly at bottom
                pos.setZ(i, fan - tilt);
            }
            geo.computeVertexNormals();
            return geo;
        }

        const RF_H  = 0.45;
        const RF_W  = 0.72;
        const RF_DP = 0.30;
        const RF_Y  = SCALLOP_BOT + RF_H * 0.5;
        const ruffleGeo = buildRuffleShell(RF_W, RF_H, RF_DP);

        const numR  = Math.ceil(TOTAL_W / (RF_W * 0.62)) + 2;
        const rS    = -TOTAL_W / 2 - RF_W * 0.3;
        for (let r = 0; r < numR; r++) {
            const rx = rS + r * RF_W * 0.62;
            if (rx > TOTAL_W / 2 + RF_W) continue;
            const ruf = new THREE.Mesh(ruffleGeo, creamDbl);
            ruf.position.set(rx, RF_Y, -0.30 + (r % 2) * 0.03);
            G.add(ruf);
        }

        // Small pearl beads along ruffle top edge
        const rbGeo = new THREE.SphereGeometry(0.10, 12, 9);
        const rbSpc = 0.62;
        const numRB = Math.ceil(TOTAL_W / rbSpc) + 1;
        for (let b = 0; b < numRB; b++) {
            const bx = -TOTAL_W / 2 + b * rbSpc;
            if (bx > TOTAL_W / 2) continue;
            const rb = new THREE.Mesh(rbGeo, pearlMat);
            rb.position.set(bx, RF_Y + RF_H * 0.44, -0.27);
            G.add(rb);
        }

        // ============================================================
        // RENDER LOOP
        // ============================================================
        function animate() {
            requestAnimationFrame(animate);
            controls.update();
            renderer.render(scene, camera);
        }
        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>

</html>
